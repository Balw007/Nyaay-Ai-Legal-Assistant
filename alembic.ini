# Lets the plain `alembic` command work from this folder. Nyaay itself does not need this file.
[alembic]
script_location = app/migrations
# the URL comes from NYAAI_DATABASE_URL (see app/migrations/env.py via app.config)
sqlalchemy.url =

[loggers]
keys = root
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic
[formatter_generic]
format = %(levelname)s %(name)s %(message)s
