<body>
<div class="shell">
  <aside class="nav" id="nav"></aside>
  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" style="display:none" onclick="document.getElementById('nav').classList.toggle('open')" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <div class="omni" id="omni" role="button" tabindex="0" aria-label="Search everything">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <span>Search matters, judgments, drafts, or ask a question…</span>
        <span class="kbd">Ctrl K</span>
      </div>
      <div class="top-r">
        <span class="small muted nowrap" id="today"></span>
        <button class="icon-btn" id="themeBtn" title="Switch theme" aria-label="Switch theme"></button>
        <button class="btn primary" onclick="newMatter()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>New matter</button>
        <div class="avatar" title="Adv. (you)">AD</div>
      </div>
    </header>
    <div id="notice"></div>
    <main class="view" id="view"></main>
  </div>
</div>
<div class="toasts" id="toasts"></div>
